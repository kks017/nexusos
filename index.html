
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="desktop">

    <!-- Desktop Icons -->
    <div class="desktop-icons">
        <button onclick="openApp('files')">📁<span>My Files</span></button>
        <button onclick="openApp('notes')">📝<span>Notes</span></button>
        <button onclick="openApp('terminal')">⌨<span>Terminal</span></button>
        <button onclick="openApp('calculator')">▦<span>Calculator</span></button>
    </div>

    <!-- File Explorer -->
    <div class="window" id="files">
        <div class="titlebar">
            <span>My Files</span>
            <div>
                <button onclick="minimizeApp('files')">_</button>
                <button onclick="closeApp('files')">×</button>
            </div>
        </div>

        <div class="toolbar">
            <button onclick="goBack()">Back</button>
            <button onclick="newFolder()">New Folder</button>
            <button onclick="newFile()">New File</button>
        </div>

        <div id="path">Home</div>
        <div id="fileList"></div>
        <div class="statusbar" id="fileStatus">Ready</div>
    </div>

    <!-- Text Editor -->
    <div class="window hidden" id="editor">
        <div class="titlebar">
            <span id="editorTitle">Text Editor</span>
            <div>
                <button onclick="minimizeApp('editor')">_</button>
                <button onclick="closeApp('editor')">×</button>
            </div>
        </div>

        <textarea id="fileText" placeholder="Write here..."></textarea>

        <div class="toolbar">
            <button onclick="saveFile()">Save File</button>
            <span id="editorStatus">Ready</span>
        </div>
    </div>

    <!-- Notes -->
    <div class="window hidden" id="notes">
        <div class="titlebar">
            <span>Notes</span>
            <div>
                <button onclick="minimizeApp('notes')">_</button>
                <button onclick="closeApp('notes')">×</button>
            </div>
        </div>

        <textarea id="notesText"
                  placeholder="Write your notes here..."></textarea>
        <div class="statusbar" id="notesStatus">Autosave enabled</div>
    </div>

    <!-- Terminal -->
    <div class="window hidden" id="terminal">
        <div class="titlebar">
            <span>Nexus Terminal</span>
            <div>
                <button onclick="minimizeApp('terminal')">_</button>
                <button onclick="closeApp('terminal')">×</button>
            </div>
        </div>

        <div id="terminalScreen">
            <div id="output">NexusOS Terminal
Type help to see commands.</div>

            <form id="terminalForm">
                <span>NexusOS&gt;</span>
                <input id="command" autocomplete="off">
            </form>
        </div>
    </div>

    <!-- Calculator -->
    <div class="window hidden" id="calculator">
        <div class="titlebar">
            <span>Calculator</span>
            <div>
                <button onclick="minimizeApp('calculator')">_</button>
                <button onclick="closeApp('calculator')">×</button>
            </div>
        </div>

        <div class="calculator-body">
            <input id="calcDisplay" value="0" readonly>

            <div class="calc-grid">
                <button onclick="calcClear()">C</button>
                <button onclick="calcOperator('/')">÷</button>
                <button onclick="calcOperator('*')">×</button>
                <button onclick="calcOperator('-')">−</button>

                <button onclick="calcNumber('7')">7</button>
                <button onclick="calcNumber('8')">8</button>
                <button onclick="calcNumber('9')">9</button>
                <button onclick="calcOperator('+')">+</button>

                <button onclick="calcNumber('4')">4</button>
                <button onclick="calcNumber('5')">5</button>
                <button onclick="calcNumber('6')">6</button>
                <button onclick="calcEquals()">=</button>

                <button onclick="calcNumber('1')">1</button>
                <button onclick="calcNumber('2')">2</button>
                <button onclick="calcNumber('3')">3</button>
                <button onclick="calcNumber('0')">0</button>

                <button onclick="calcNumber('.')">.</button>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="startMenu" class="hidden">
        <strong>NexusOS</strong>
        <button onclick="openApp('files')">My Files</button>
        <button onclick="openApp('notes')">Notes</button>
        <button onclick="openApp('terminal')">Terminal</button>
        <button onclick="openApp('calculator')">Calculator</button>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button id="startButton">Start</button>
        <div id="taskApps"></div>
        <span id="clock">00:00</span>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
